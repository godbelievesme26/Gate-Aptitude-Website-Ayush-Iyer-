<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Internal corpus rendering audit</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/system.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/quiz.css"><link rel="stylesheet" href="css/home.css"><link rel="stylesheet" href="css/moments.css"><link rel="stylesheet" href="css/revision.css">
<style>#audit-tools{position:fixed;bottom:0;left:0;right:0;z-index:200000;background:#fff;color:#111;border-top:2px solid #555;padding:6px;font:12px Arial;display:flex;gap:6px;flex-wrap:wrap;align-items:center}#audit-tools button,#audit-tools select,#audit-tools input{padding:4px;font:12px Arial;min-height:28px}#audit-output{width:100%;max-height:90px;overflow:auto;white-space:pre-wrap}#audit-json{display:none}</style></head>
<body><aside class="sidebar" aria-label="Audit placeholder for production sidebar">Internal audit</aside><div class="workspace"><header class="topbar">Production rendering components · isolated state</header><main id="main"></main></div>
<section id="audit-tools" aria-label="Internal audit controls"><button id="run">Audit all questions</button><label>Theme<select id="theme"><option>light</option><option>dark</option></select></label><label>Question<select id="question"></select></label><label>View<select id="view"><option>practice</option><option>exam</option><option>detail</option><option>result</option></select></label><button id="show">Inspect question</button><button id="download" disabled>Download report</button><output id="audit-status">Loading archive</output><pre id="audit-output"></pre><textarea id="audit-json" aria-label="Full report"></textarea></section>
<script type="module" src="/audit.js"></script></body></html>
